<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" role="img" aria-labelledby="title desc"><title id="title">One source, two editable formats</title><desc id="desc">A researched outline feeds separate PowerPoint and Word JSON specifications. Builders produce editable files, structural validators check them, and optional Office rendering enables visual inspection.</desc><rect width="1400" height="400" rx="22" fill="#F1F5F1"/><g stroke="#9FB9AD" stroke-width="3" fill="none"><path d="M252 200H302V128H347M302 200V273H347M660 128H710V200H768M660 273H710V200M1030 200H1094"/></g><g fill="#163D38"><path d="M342 119L356 128L342 137Z M342 264L356 273L342 282Z M754 191L768 200L754 209Z M1080 191L1094 200L1080 209Z"/></g><rect x="38" y="142" width="214" height="118" rx="12" fill="#163D38"/><rect x="356" y="71" width="304" height="114" rx="12" fill="#FFFFFF" stroke="#C7D7CE"/><rect x="356" y="216" width="304" height="114" rx="12" fill="#FFFFFF" stroke="#C7D7CE"/><rect x="768" y="142" width="262" height="118" rx="12" fill="#163D38"/><rect x="1094" y="142" width="268" height="118" rx="12" fill="#FFFFFF" stroke="#C7D7CE"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="145" y="192" font-size="24" font-weight="700" fill="#FFFFFF">Source + outline</text><text x="145" y="225" font-size="16" fill="#BED6CE">Claims, sources, visuals</text><text x="508" y="119" font-size="24" font-weight="700" fill="#163D38">PowerPoint builder</text><text x="508" y="151" font-size="17" fill="#53615C">Slide JSON → editable PPTX</text><text x="508" y="264" font-size="24" font-weight="700" fill="#163D38">Word builder</text><text x="508" y="296" font-size="17" fill="#53615C">Document JSON → editable DOCX</text><text x="899" y="192" font-size="24" font-weight="700" fill="#FFFFFF">Structural checks</text><text x="899" y="225" font-size="16" fill="#BED6CE">Reopen the saved bytes</text><text x="1228" y="192" font-size="24" font-weight="700" fill="#163D38">Render + inspect</text><text x="1228" y="225" font-size="16" fill="#53615C">Optional Office / LibreOffice</text><text x="700" y="373" font-size="16" fill="#53615C">Validation catches structural mistakes. Rendering reveals what readers actually see.</text></g></svg>
