    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#E8EEFF">
      <text x="660" y="242">PowerPoint</text>
      <text x="836" y="242">Word</text>
      <text x="1012" y="242">PDF</text>
      <text x="660" y="314">Excel</text>
      <text x="836" y="314">Poster</text>
      <text x="1012" y="314">Research</text>
