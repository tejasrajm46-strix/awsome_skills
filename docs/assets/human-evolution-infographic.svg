<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="870" viewBox="0 0 2200 870" role="img"><title>Overlapping human histories</title><desc>Selected approximate fossil ranges, not an ancestry tree. Deep-time and recent-time panels have separate linear scales.</desc><rect width="100%" height="100%" fill="#FAF8F3"/>
