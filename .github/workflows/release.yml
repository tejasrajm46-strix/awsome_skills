name: release

# Push a tag and this builds the skill zip and publishes it on a GitHub Release.
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify the skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet python-pptx
      - name: Run the layout regression suite
        run: python ppt_skill/tests/test_layout_rules.py
      - name: Build the example deck and gate it
        run: |
          set -euo pipefail
          python ppt_skill/scripts/build_deck.py examples/quick-start.json -o /tmp/ci.pptx
          python ppt_skill/scripts/transitions.py /tmp/ci.pptx --preset fade --duration 700
          python ppt_skill/scripts/validate_deck.py /tmp/ci.pptx --expect 5

  release:
    name: Publish the release
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package the skill
        run: python tools/package_skill.py --version "$VERSION"
      - name: Check the archive holds the skill and nothing else
        run: |
          set -euo pipefail
          python - "$VERSION" <<'PY'
          import sys, zipfile
          version = sys.argv[1]
          with zipfile.ZipFile("pptx-generator-%s.zip" % version) as zf:
              names = zf.namelist()
          bad = [n for n in names if not n.startswith("pptx-generator/")]
          assert bad == [], "entries outside the skill folder: %s" % bad
          assert "pptx-generator/SKILL.md" in names, names
          assert all("__pycache__" not in n for n in names), names
          assert all(not n.endswith(".pptx") for n in names), names
          print("archive holds %d skill files, nothing else" % len(names))
          PY
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "pptx-generator-$VERSION.zip" \
            --title "$VERSION" \
            --generate-notes
