name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, matching skills.json"
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify all skills
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: browser-actions/setup-chrome@v1
      - run: python -m pip install python-pptx python-docx Pillow
      - name: Read the release version from the catalog
        run: echo "VERSION=$(python -c "import json; print(json.load(open('skills.json'))['version'])")" >> "$GITHUB_ENV"
      - name: Check release metadata consistency
        run: python tools/check_release.py
      - name: Build all portable packages
        run: python tools/package_skill.py --skill all --version "$VERSION"
      - name: Check repository, syntax and installation
        run: |
          set -euo pipefail
          python tools/verify_repository.py
          python tools/test_package_skill.py
      - name: Gate every skill document
        run: |
          set -euo pipefail
          python tools/skillopt_gate.py check
          python tools/test_skillopt_gate.py
          python tools/test_skill_registry.py
          python tools/test_skill_cache.py
          python tools/test_task_planner.py
          python tools/test_task_state.py
          python tools/test_task_executor.py
          python tools/test_orchestrator_e2e.py
          python tools/test_orchestration_defects.py
          python tools/test_capability_probe.py
          python tools/changelog_notes.py "$VERSION" > /dev/null
      - name: Run all skill regression suites
        run: |
          set -euo pipefail
          python ppt_skill/tests/test_layout_rules.py
          python ppt_skill/tests/test_extract_office_assets.py
          python word_skill/tests/test_doc_rules.py
          python word_skill/tests/test_inspect_docx.py
          python pdf_skill/tests/test_inspect_pdf.py
          python xlsm_skill/tests/test_inspect_workbook.py
          python xlsm_skill/tests/test_inspect_xlsm.py
          python ultimate-scrape-skill/tests/test_scraping.py
          python ultimate-scrape-skill/tests/test_source_register.py
          python ultimate-scrape-skill/tests/test_security.py
          python ultimate-scrape-skill/tests/test_handoff.py
          node poster_skill/tests/test_template_mode.mjs
      - name: Generate and strictly validate example files
        run: |
          set -euo pipefail
          python ppt_skill/scripts/build_deck.py examples/quick-start.json -o /tmp/ci.pptx
          python ppt_skill/scripts/validate_deck.py /tmp/ci.pptx --expect 5 --strict
          python word_skill/scripts/build_doc.py examples/word-quick-start.json -o /tmp/ci.docx
          python word_skill/scripts/validate_doc.py /tmp/ci.docx --strict

  release:
    name: Publish all packages
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tagged version matches the catalog
        run: |
          set -euo pipefail
          CATALOG=$(python -c "import json; print(json.load(open('skills.json'))['version'])")
          if [ "$CATALOG" != "$VERSION" ]; then
            echo "tag $VERSION does not match skills.json version $CATALOG" >&2
            exit 1
          fi
      - name: Package every skill
        run: python tools/package_skill.py --skill all --version "$VERSION"
      - name: Take the release notes from the reviewed changelog
        run: python tools/changelog_notes.py "$VERSION" > release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" releases/skills/*-"$VERSION".zip --clobber
            gh release edit "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" \
              releases/skills/*-"$VERSION".zip \
              --title "$VERSION" \
              --notes-file release-notes.md
          fi
