<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title-c desc-c">
  <title id="title-c">Awesome Skills — creative automation</title>
  <desc id="desc-c">A workspace panel holds six skill modules: PowerPoint, Word, PDF, Excel, Poster and Research. A research stream feeds them and three checked deliverables assemble below.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191E"/>
      <stop offset="0.55" stop-color="#1A1F25"/>
      <stop offset="1" stop-color="#252D35"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#83E6CE" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#83E6CE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#83E6CE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00B8A9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#00B8A9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.40"/>
    </radialGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83E6CE"/>
      <stop offset="0.55" stop-color="#00B8A9"/>
      <stop offset="1" stop-color="#00B8A9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#83E6CE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B8A9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00B8A9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="440" fill="url(#bg)"/>
  <g id="title-block">
    <text x="64" y="120" font-size="18" fill="#00B8A9" font-weight="600" letter-spacing="4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">CREATIVE AUTOMATION</text>
    <text x="64" y="184" font-size="54" fill="#F4F7F8" font-weight="700" letter-spacing="0.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">AWESOME SKILLS</text>
    <path d="M64 210H214" stroke="url(#edge)" stroke-width="2"/>
    <text x="64" y="250" font-size="23" fill="#C5D0D8" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">One ecosystem. Multiple capabilities.</text>
    <text x="64" y="330" font-size="19" fill="#7C8B96" font-weight="400" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">v3.2.0  /  MIT  /  six skills</text>
  </g>
  <ellipse cx="900" cy="210" rx="330" ry="210" fill="url(#halo)" opacity="0.55"/>
<rect x="608" y="76" width="552" height="252" rx="20" fill="#1A1F25" stroke="#2E3841" stroke-width="1"/>
<rect x="608" y="76" width="552" height="6" rx="3" fill="#FFB454" opacity="0.55"/>
  <g id="stream"><path d="M596 340L1148 340" fill="none" stroke="#38444E" stroke-width="1.4" stroke-dasharray="6 9" stroke-opacity="0.75"/><circle cx="700" cy="340" r="2.6" fill="#00B8A9"/><circle cx="820" cy="340" r="2.6" fill="#00B8A9"/><circle cx="940" cy="340" r="2.6" fill="#00B8A9"/><circle cx="1060" cy="340" r="2.6" fill="#00B8A9"/></g>
  <g id="card-1"><rect x="632" y="100" width="152" height="88" rx="14" fill="#252D35" stroke="#2C353D" stroke-width="1"/><rect x="632" y="100" width="152" height="3" rx="1.5" fill="#83E6CE" opacity="0.8"/><text x="650" y="138" font-size="19" fill="#F4F7F8" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">PowerPoint</text><text x="650" y="160" font-size="14" fill="#7C8B96" font-weight="400" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">Deck JSON → PPTX</text><circle cx="650" cy="174" r="2.6" fill="#83E6CE"/></g>
  <g id="card-2"><rect x="804" y="100" width="152" height="88" rx="14" fill="#252D35" stroke="#2C353D" stroke-width="1"/><rect x="804" y="100" width="152" height="3" rx="1.5" fill="#00B8A9" opacity="0.8"/><text x="822" y="138" font-size="19" fill="#F4F7F8" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">Word</text><text x="822" y="160" font-size="14" fill="#7C8B96" font-weight="400" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">Doc JSON → DOCX</text><circle cx="822" cy="174" r="2.6" fill="#00B8A9"/></g>
  <g id="card-3"><rect x="976" y="100" width="152" height="88" rx="14" fill="#252D35" stroke="#2C353D" stroke-width="1"/><rect x="976" y="100" width="152" height="3" rx="1.5" fill="#00B8A9" opacity="0.8"/><text x="994" y="138" font-size="19" fill="#F4F7F8" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">PDF</text><text x="994" y="160" font-size="14" fill="#7C8B96" font-weight="400" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">Extract · fill</text><circle cx="994" cy="174" r="2.6" fill="#00B8A9"/></g>
  <g id="card-4"><rect x="632" y="208" width="152" height="88" rx="14" fill="#252D35" stroke="#2C353D" stroke-width="1"/><rect x="632" y="208" width="152" height="3" rx="1.5" fill="#00B8A9" opacity="0.8"/><text x="650" y="246" font-size="19" fill="#F4F7F8" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">Excel</text><text x="650" y="268" font-size="14" fill="#7C8B96" font-weight="400" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">Template → XLSM</text><circle cx="650" cy="282" r="2.6" fill="#00B8A9"/></g>
  <g id="card-5"><rect x="804" y="208" width="152" height="88" rx="14" fill="#252D35" stroke="#2C353D" stroke-width="1"/><rect x="804" y="208" width="152" height="3" rx="1.5" fill="#83E6CE" opacity="0.8"/><text x="822" y="246" font-size="19" fill="#F4F7F8" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">Poster</text><text x="822" y="268" font-size="14" fill="#7C8B96" font-weight="400" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">HTML → print PNG</text><circle cx="822" cy="282" r="2.6" fill="#83E6CE"/></g>
  <g id="card-6"><rect x="976" y="208" width="152" height="88" rx="14" fill="#252D35" stroke="#2C353D" stroke-width="1"/><rect x="976" y="208" width="152" height="3" rx="1.5" fill="#00B8A9" opacity="0.8"/><text x="994" y="246" font-size="19" fill="#F4F7F8" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">Research</text><text x="994" y="268" font-size="14" fill="#7C8B96" font-weight="400" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">Shared pipeline</text><circle cx="994" cy="282" r="2.6" fill="#00B8A9"/></g>
  <g id="deliverable-1"><rect x="640" y="356" width="152" height="54" rx="12" fill="#252D35" stroke="#3A4750" stroke-width="1"/><text x="658" y="380" font-size="16" fill="#C5D0D8" font-weight="700" letter-spacing="1.6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">PPTX</text><rect x="658" y="390" width="78" height="6" rx="3" fill="#2C353D"/><circle cx="770" cy="384" r="7" fill="#132B27" stroke="#83E6CE" stroke-width="1.2"/><path d="M766 384L769 387L774 380" fill="none" stroke="#83E6CE" stroke-width="1.3"/></g>
  <g id="deliverable-2"><rect x="808" y="356" width="152" height="54" rx="12" fill="#252D35" stroke="#3A4750" stroke-width="1"/><text x="826" y="380" font-size="16" fill="#C5D0D8" font-weight="700" letter-spacing="1.6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">DOCX</text><rect x="826" y="390" width="78" height="6" rx="3" fill="#2C353D"/><circle cx="938" cy="384" r="7" fill="#132B27" stroke="#83E6CE" stroke-width="1.2"/><path d="M934 384L937 387L942 380" fill="none" stroke="#83E6CE" stroke-width="1.3"/></g>
  <g id="deliverable-3"><rect x="976" y="356" width="152" height="54" rx="12" fill="#252D35" stroke="#3A4750" stroke-width="1"/><text x="994" y="380" font-size="16" fill="#C5D0D8" font-weight="700" letter-spacing="1.6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">PDF</text><rect x="994" y="390" width="78" height="6" rx="3" fill="#2C353D"/><circle cx="1106" cy="384" r="7" fill="#132B27" stroke="#83E6CE" stroke-width="1.2"/><path d="M1102 384L1105 387L1110 380" fill="none" stroke="#83E6CE" stroke-width="1.3"/></g>
  <rect width="1200" height="440" fill="url(#vignette)"/>
</svg>
