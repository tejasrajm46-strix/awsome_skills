<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title-b desc-b">
  <title id="title-b">Awesome Skills — intelligence engine</title>
  <desc id="desc-b">A data packet enters a three-layer engine: registry, planner and executor. Four processing nodes activate in sequence, paths connect, validation completes and three deliverables emerge.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191E"/>
      <stop offset="0.55" stop-color="#1A1F25"/>
      <stop offset="1" stop-color="#252D35"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#83E6CE" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#83E6CE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#83E6CE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00B8A9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#00B8A9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.40"/>
    </radialGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83E6CE"/>
      <stop offset="0.55" stop-color="#00B8A9"/>
      <stop offset="1" stop-color="#00B8A9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#83E6CE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B8A9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00B8A9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="440" fill="url(#bg)"/>
  <g id="title-block">
    <text x="64" y="120" font-size="18" fill="#00B8A9" font-weight="600" letter-spacing="4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">INTELLIGENCE ENGINE</text>
    <text x="64" y="184" font-size="54" fill="#F4F7F8" font-weight="700" letter-spacing="0.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">AWESOME SKILLS</text>
    <path d="M64 210H214" stroke="url(#edge)" stroke-width="2"/>
    <text x="64" y="250" font-size="23" fill="#C5D0D8" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">Discover. Plan. Execute. Validate.</text>
    <text x="64" y="330" font-size="19" fill="#7C8B96" font-weight="400" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">v3.2.0  /  MIT  /  six packages</text>
  </g>
